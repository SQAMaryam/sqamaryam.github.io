name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A76CBD: ${{ secrets.A76CBD }}
          BC8093: ${{ secrets.BC8093 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A76CBD', '')
          tag_b = os.environ.get('BC8093', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 1fe282daa8814107981bb214430f96e4fda062b2 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- cb6e25e04ab49271eb542623c0006409d278e7 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
