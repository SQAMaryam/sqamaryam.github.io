for(let i=0;i<n;i++){const s0=-Math.PI/2+i*a;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-12,s0,s0+a);x.closePath();

x.save();x.translate(R,R);x.rotate(s0+a/2);x.textAlign='right';x.fillStyle='#2f3550';x.textBaseline='middle';const mw=R-36-58;let t=W.items[i].n,fs=n>8?24:28;x.font='700 '+fs+'px Nunito,sans-serif';
while(x.measureText(t).width>mw&&fs>19){fs--;x.font='700 '+fs+'px Nunito,sans-serif'}
while(x.measureText(t).width>mw&&t.length>3)t=t.slice(0,-2)+'…';x.fillText(t,R-36,0);x.restore()}
x.beginPath();x.arc(R,R,R-8,0,7);x.lineWidth=12;x.strokeStyle='#f08ab3';x.stroke();
for(let i=0;i<24;i++){const g=i*Math.PI/12;x.beginPath();x.arc(R+Math.cos(g)*(R-8),R+Math.sin(g)*(R-8),4,0,7);x.fillStyle=i%2?'#ffffff':'#cfe8fa';x.fill()}

x.save();x.translate(R,R+2);x.scale(1.3,1.3);x.fillStyle='#e0558c';x.beginPath();x.moveTo(0,10);x.bezierCurveTo(-14,0,-10,-12,0,-5);x.bezierCurveTo(10,-12,14,0,0,10);x.fill();x.restore()}
function spin(){drawWheel();if(W.busy)return;const m=W.items;if(!m.length){$('pk').innerHTML=`<div class="card big">Nothing matches!<br><small>Widen the budget or clear a cuisine.</small></div>`;return}
const n=m.length,a=2*Math.PI/n,i=Math.floor(Math.random()*n),jit=(Math.random()-.5)*a*.6,TP=2*Math.PI;
const need=((-((i+.5)*a+jit)-W.rot)%TP+TP)%TP,from=W.rot,to=W.rot+TP*(5+Math.floor(Math.random()*3))+need,dur=4800+Math.random()*900;
W.busy=true;$('wb').disabled=true;$('pk').innerHTML='';const c=$('wh');c.style.transition='none';

const ptr=document.querySelector('.ptr');let lastSeg=Math.floor(from/a),t0=performance.now();
(function f(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,4);W.rot=from+(to-from)*e;const cc=$('wh');if(cc)cc.style.transform='rotate('+W.rot+'rad)';

const d=e.length==1?`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r0}A${r0} ${r0} 0 1 0 ${cx} ${cy-r0}Z`:`M${p(a0,R)}A${R} ${R} 0 ${L} 1 ${p(a1,R)}L${p(a1,r0)}A${r0} ${r0} 0 ${L} 0 ${p(a0,r0)}Z`;
paths+=`<path d="${d}" fill="${col(k,i)}" stroke="var(--card)" stroke-width="2"><title>${esc(k)}: ${money(v)} (${Math.round(v/tot*100)}%)</title></path>`;a0=a1});

function log(){const m=S.logs.filter(l=>l.d.startsWith(V.mon)),tot=m.reduce((a,l)=>a+l.amt,0),cnt={};

/* ---------- TRAIL ---------- */
function map(){const L=[...S.logs].sort((a,b)=>a.d<b.d?-1:1);
if(!L.length)return `<div class="card">${H2('Our Food Trail')}<p class="hint">Your journey appears here once you log your first meal. Head to Spend to start.</p></div>`;
const H=L.length*90+60;let pts=L.map((l,i)=>[i%2?230:70,50+i*90]);
let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=` C${a[0]} ${my},${b[0]} ${my},${b[0]} ${b[1]}`}
const nodes=L.map((l,i)=>{const [x,y]=pts[i],r=x<150,tx=r?x+24:x-24,an=r?'start':'end',nm=rn(l.r),sw=isAft(byId(l.r)||{});
return `<circle cx="${x}" cy="${y}" r="16" fill="${sw?'var(--lav)':i%2?'var(--blue)':'var(--pink)'}" stroke="var(--pk)" stroke-width="3"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${i==L.length-1?'★':i+1}</text>
<text x="${tx}" y="${y-3}" text-anchor="${an}" font-size="12" fill="var(--ink)" font-weight="700">${esc(nm.length>17?nm.slice(0,16)+'…':nm)}</text><text x="${tx}" y="${y+13}" text-anchor="${an}" font-size="11" fill="var(--mut)">${l.d.slice(8)}/${l.d.slice(5,7)}/${l.d.slice(2,4)}</text>`}).join('');
return `<div class="card">${H2('Our Food Trail')}<p class="hint">Every stop on our adventure, in order. Lavender stops are coffee, tea or dessert.</p><svg viewBox="0 0 300 ${H}" width="100%"><path d="${d}" fill="none" stroke="var(--pk)" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>${nodes}</svg></div>`}

function fixD(d){d=String(d||'').trim();const m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return /^\d{4}-\d\d-\d\d$/.test(d)?d:''}

const MW=91,MH=130,img=w.querySelector('img'),bub=w.querySelector('.mb'),rnd=(a,b)=>a+Math.random()*(b-a);
const navH=()=>{const n=document.getElementById('nav');return n?Math.max(0,innerHeight-n.getBoundingClientRect().top):0};
let cur=null,last='';
function say(t,ms){bub.textContent=t;bub.classList.remove('on');void bub.offsetWidth;bub.classList.add('on');clearTimeout(bub._t);bub._t=setTimeout(()=>bub.classList.remove('on'),ms||1800)}
function go_(cx,cy,frames,dur,ease,flip){if(cur){try{cur.cancel()}catch(e){}}w.style.translate='';img.style.scale=flip?'-1 1':'';w.style.left=(cx-MW/2)+'px';w.style.top=(cy-MH/2)+'px';w.style.visibility='visible';
cur=w.animate(frames.map(f=>({transform:`translate(${f[0]}px,${f[1]}px) rotate(${f[2]}deg)`,offset:f[3]})),{duration:dur,easing:ease||'ease-in-out',fill:'forwards'});
return cur.finished.then(()=>{w.style.visibility='hidden'}).catch(()=>{})}
const peek=(cx,cy,dx,dy,r,dur)=>go_(cx,cy,[[0,0,r,0],[dx,dy,r,.18],[dx,dy,r-12,.32],[dx,dy,r+12,.46],[dx,dy,r-8,.6],[dx,dy,r,.72],[dx*.92,dy*.92,r,.8],[0,0,r,1]],dur);
const B={
left(){const cy=rnd(innerHeight*.22,innerHeight*.62);return peek(-MH/2-12,cy,MH*.84,0,90,4400)},
right(){const cy=rnd(innerHeight*.22,innerHeight*.62);return peek(innerWidth+MH/2+12,cy,-MH*.84,0,-90,4400)},

function walk(pts,speed,face){w2.style.translate='';img2.src=face=='front'?IMG_FRONT:IMG_BACK;if(cur2){try{cur2.cancel()}catch(e){}}const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);tot+=d}
const dur=tot/speed*1000,steps=Math.max(6,Math.round(dur/320)),fr=[];
const at=s=>{let d=s*tot;for(let i=0;i<seg.length;i++){if(d<=seg[i]||i==seg.length-1){const k=seg[i]?Math.min(1,d/seg[i]):0;return [pts[i][0]+(pts[i+1][0]-pts[i][0])*k,pts[i][1]+(pts[i+1][1]-pts[i][1])*k,pts[i][2]+((pts[i+1][2]??pts[i][2])-pts[i][2])*k,pts[i+1][0]-pts[i][0]]}d-=seg[i]}};
for(let k=0;k<=steps;k++){const s=k/steps,[x,y,sc,mdx]=at(s),odd=k%2,fx=face=='front'&&mdx>2?-1:1;fr.push({transform:`translate(${x-WW/2}px,${y-WH/2+(odd?-6:0)}px) rotate(${k==0||k==steps?0:(odd?6:-6)}deg) scale(${fx*(sc||1)},${sc||1})`,offset:s})}
w2.style.left='0px';w2.style.top='0px';w2.style.visibility='visible';cur2=w2.animate(fr,{duration:dur,easing:'linear',fill:'forwards'});return cur2.finished.then(()=>{w2.style.visibility='hidden'}).catch(()=>{})}
const midY=()=>rnd(innerHeight*.38,innerHeight*.62);
B.stroll=function(){const dir=Math.random()<.5?1:-1,y=midY(),x0=dir>0?-WW:innerWidth+WW,x1=dir>0?innerWidth+WW:-WW;setTimeout(()=>say2(['Off to makan…','Where shall we eat?','Hmm hmm hmm~'][Math.floor(Math.random()*3)]),1500);return walk([[x0,y,1],[innerWidth*.5,y+rnd(-30,30),1],[x1,y+rnd(-40,40),1]],70,'front')};
B.wander=function(){const L=Math.random()<.5,p=[[rnd(innerWidth*.3,innerWidth*.7),innerHeight+WH,1.15]];for(let i=0;i<3;i++)p.push([rnd(innerWidth*.18,innerWidth*.82),rnd(innerHeight*.32,innerHeight*.68),1-i*.08]);p.push([L?-WW:innerWidth+WW,rnd(innerHeight*.35,innerHeight*.6),.8]);setTimeout(()=>say2('Lapar…'),2200);return walk(p,65,'back')};
B.approach=function(){const x=rnd(innerWidth*.3,innerWidth*.7),p=[[x,-WH,.7],[x+rnd(-40,40),innerHeight*.35,.85],[x+rnd(-50,50),innerHeight*.55,1.05],[Math.random()<.5?-WW:innerWidth+WW,innerHeight*.62,1.1]];setTimeout(()=>say2(['Hi crew!','Coming to makan!','Wait for me!'][Math.floor(Math.random()*3)]),1800);return walk(p,70,'front')};

let held=0;const pick=a=>a[Math.floor(Math.random()*a.length)];
function draggable(el,getA,sayFn){const im=el.querySelector('img');let sx=0,sy=0,ox=0,oy=0,moved=false,down=false,swing=null;
im.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;const tr=(el.style.translate||'0px 0px').split(' ');ox=parseFloat(tr[0])||0;oy=parseFloat(tr[1])||0;try{im.setPointerCapture(e.pointerId)}catch(_){}});
im.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;
if(!moved&&Math.hypot(dx,dy)>6){moved=true;held++;const a=getA();if(a&&a.playState=='running')a.pause();el.classList.add('held');swing=im.animate([{transform:'rotate(-9deg)'},{transform:'rotate(9deg)'}],{duration:240,iterations:Infinity,direction:'alternate',easing:'ease-in-out'});sayFn(pick(['Wheee!','Put me down!','Whoa!','Hehe, ticklish!']))}
if(moved){el.style.translate=`${ox+dx}px ${oy+dy}px`;e.preventDefault()}});
const up=()=>{if(!down)return;down=false;if(!moved)return;held=Math.max(0,held-1);el.classList.remove('held');if(swing){swing.cancel();swing=null}
im.animate([{transform:'scale(1.12,.86)'},{transform:'scale(.94,1.06)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
const a=getA();if(a&&a.playState=='paused')a.play();sayFn(pick(['Okay, carry on!','Thanks for the lift!','Back to it!']));el._dragged=Date.now()};
im.addEventListener('pointerup',up);im.addEventListener('pointercancel',up)}

const DIRS={left:['left'],right:['right'],top:['top'],bottom:['bottom','wave','dance'],middle:['stroll','wander','approach']};
